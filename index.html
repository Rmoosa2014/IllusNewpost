<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Mobile Mockup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --ig-primary-text: #000000;
            --ig-secondary-text: #737373;
            --ig-border: #dbdbdb;
            --ig-blue: #0095f6;
            --ig-background: #ffffff;
            --ig-active-tab: #262626;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .mobile-container {
            width: 375px;
            height: 812px;
            background-color: var(--ig-background);
            border-radius: 40px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 8px solid #1f2937; /* Simulating phone bezel */
            display: flex;
            flex-direction: column;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .content-area {
            flex-grow: 1;
            overflow-y: auto;
            position: relative;
            scroll-behavior: smooth;
        }

        .tab-btn.active {
            border-bottom: 2px solid var(--ig-primary-text);
            color: var(--ig-primary-text);
        }
        .tab-btn {
            color: var(--ig-secondary-text);
        }

        /* Enforcing 3:4 Aspect Ratio for Grid and Feed */
        .aspect-3-4 {
            aspect-ratio: 3 / 4;
        }

        .grid-item {
            background-color: #efefef;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }
        
        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-media-container {
            background-color: #efefef;
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        .carousel-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            width: 100%;
            height: 100%;
        }
        
        .carousel-slide {
            width: 100%;
            height: 100%;
            flex-shrink: 0;
            scroll-snap-align: start;
            position: relative;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none; /* Prevents dragging the image itself on desktop */
        }

        .story-ring {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            padding: 2px;
            border-radius: 50%;
        }

        .story-ring-inner {
            background: white;
            padding: 2px;
            border-radius: 50%;
        }
        
        .carousel-icon {
            filter: drop-shadow(0px 0px 2px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- Top Status Bar Mockup -->
        <div class="h-6 w-full flex justify-between items-center px-6 pt-2 text-xs font-semibold z-50 bg-white">
            <span>9:41</span>
            <div class="flex space-x-2">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <!-- APP VIEWS CONTAINER -->
        <div id="app-views" class="content-area hide-scrollbar">
            
            <!-- FEED VIEW (Hidden by default now) -->
            <div id="view-feed" class="hidden pb-16">
                <!-- Header -->
                <header class="flex justify-between items-center p-4 border-b border-gray-200 sticky top-0 bg-white z-40">
                    <h1 class="text-2xl font-bold font-serif italic tracking-tighter">Instagram</h1>
                    <div class="flex space-x-4 text-xl">
                        <i class="fa-regular fa-heart"></i>
                        <i class="fa-regular fa-message"></i>
                    </div>
                </header>

                <!-- Stories -->
                <div class="flex space-x-4 p-4 overflow-x-auto hide-scrollbar border-b border-gray-200">
                    <div class="flex flex-col items-center min-w-[70px]">
                        <div class="relative w-16 h-16 rounded-full overflow-hidden border border-gray-300">
                            <img src="https://picsum.photos/seed/myprofile/100/100" alt="Your Story" class="w-full h-full object-cover">
                            <div class="absolute bottom-0 right-0 bg-blue-500 rounded-full w-5 h-5 flex items-center justify-center border-2 border-white text-white text-xs">
                                <i class="fa-solid fa-plus"></i>
                            </div>
                        </div>
                        <span class="text-xs mt-1 text-gray-500">Your story</span>
                    </div>
                    <!-- Other Stories Generation Script Placeholder -->
                    <div id="stories-container" class="flex space-x-4"></div>
                </div>

                <!-- Feed Posts Container -->
                <div id="feed-container"></div>
            </div>

            <!-- PROFILE VIEW (Active by default) -->
            <div id="view-profile" class="block pb-16 bg-white min-h-full">
                <!-- Profile Header -->
                <header class="flex justify-between items-center p-4 sticky top-0 bg-white z-40">
                    <div class="flex items-center space-x-1 font-bold text-lg">
                        <i class="fa-solid fa-lock text-sm"></i>
                        <span>lighting.stores</span>
                        <i class="fa-solid fa-angle-down text-sm text-gray-500"></i>
                    </div>
                    <div class="flex space-x-4 text-xl">
                        <i class="fa-regular fa-square-plus"></i>
                        <i class="fa-solid fa-bars"></i>
                    </div>
                </header>

                <!-- Profile Info -->
                <div class="px-4 pt-2">
                    <div class="flex justify-between items-center">
                        <!-- DP -->
                        <div class="story-ring w-24 h-24">
                            <div class="story-ring-inner w-full h-full">
                                <img src="https://picsum.photos/seed/lightingdp/200/200" alt="Profile" class="w-full h-full rounded-full object-cover">
                            </div>
                        </div>
                        <!-- Stats -->
                        <div class="flex flex-1 justify-around text-center ml-4">
                            <div class="flex flex-col">
                                <span class="font-bold text-lg">248</span>
                                <span class="text-sm text-gray-500">posts</span>
                            </div>
                            <div class="flex flex-col">
                                <span class="font-bold text-lg">12.5K</span>
                                <span class="text-sm text-gray-500">followers</span>
                            </div>
                            <div class="flex flex-col">
                                <span class="font-bold text-lg">342</span>
                                <span class="text-sm text-gray-500">following</span>
                            </div>
                        </div>
                    </div>

                    <!-- Bio -->
                    <div class="mt-4">
                        <h2 class="font-bold text-sm">Lighting Stores | Premium Fixtures</h2>
                        <p class="text-sm">✨ Illuminating your spaces with elegance.</p>
                        <p class="text-sm">💡 Modern & Classic Designs</p>
                        <p class="text-sm">📍 Worldwide Shipping</p>
                        <a href="#" class="text-sm text-blue-900 font-semibold flex items-center mt-1">
                            <i class="fa-solid fa-link mr-1"></i> linktr.ee/lightingstores
                        </a>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex mt-4 space-x-2">
                        <button class="flex-1 bg-gray-100 hover:bg-gray-200 text-black font-semibold py-1.5 px-4 rounded-lg text-sm">Edit profile</button>
                        <button class="flex-1 bg-gray-100 hover:bg-gray-200 text-black font-semibold py-1.5 px-4 rounded-lg text-sm">Share profile</button>
                        <button class="bg-gray-100 hover:bg-gray-200 text-black font-semibold py-1.5 px-3 rounded-lg text-sm">
                            <i class="fa-solid fa-user-plus"></i>
                        </button>
                    </div>
                </div>

                <!-- Profile Tabs -->
                <div class="flex border-t border-gray-200 mt-4">
                    <button id="tab-grid" class="flex-1 py-3 text-center tab-btn active" onclick="switchProfileTab('grid')">
                        <i class="fa-solid fa-border-all text-xl"></i>
                    </button>
                    <button id="tab-reels" class="flex-1 py-3 text-center tab-btn" onclick="switchProfileTab('reels')">
                        <i class="fa-solid fa-clapperboard text-xl"></i>
                    </button>
                    <button id="tab-tagged" class="flex-1 py-3 text-center tab-btn" onclick="switchProfileTab('tagged')">
                        <i class="fa-solid fa-user-tag text-xl"></i>
                    </button>
                </div>

                <!-- Tab Contents (Injected via JS) -->
                <div id="content-grid" class="grid grid-cols-3 gap-0.5"></div>
                <div id="content-reels" class="grid grid-cols-3 gap-0.5 hidden"></div>
                <div id="content-tagged" class="grid grid-cols-3 gap-0.5 hidden"></div>
            </div>

            <!-- PROFILE POST FEED VIEW (Expanded Grid Items) -->
            <div id="view-profile-feed" class="hidden pb-16 bg-white min-h-full">
                <!-- Header -->
                <header class="flex items-center p-4 border-b border-gray-200 sticky top-0 bg-white z-40">
                    <button onclick="closeProfilePost()" class="text-2xl mr-4 active:scale-90 transition-transform"><i class="fa-solid fa-angle-left"></i></button>
                    <div class="font-bold text-lg flex-1 text-center pr-8">Posts</div>
                </header>
                
                <!-- Expanded Feed Container -->
                <div id="profile-feed-container"></div>
            </div>
        </div>

        <!-- BOTTOM NAVIGATION -->
        <nav class="absolute bottom-0 w-full bg-white border-t border-gray-200 px-6 py-3 flex justify-between items-center pb-6 z-50">
            <button onclick="switchView('feed')" id="nav-home" class="text-2xl text-gray-400 hover:text-black transition-transform active:scale-90">
                <i class="fa-solid fa-house"></i>
            </button>
            <button class="text-2xl text-gray-400 hover:text-black transition-transform active:scale-90">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
            <button class="text-2xl text-gray-400 hover:text-black transition-transform active:scale-90">
                <i class="fa-regular fa-square-plus"></i>
            </button>
            <button class="text-2xl text-gray-400 hover:text-black transition-transform active:scale-90">
                <i class="fa-brands fa-youtube"></i>
            </button>
            <!-- Highlighted by default since we start on profile -->
            <button onclick="switchView('profile')" id="nav-profile" class="w-7 h-7 rounded-full overflow-hidden border-2 border-black transition-transform active:scale-90">
                <img src="https://picsum.photos/seed/lightingdp/100/100" alt="Profile" class="w-full h-full object-cover">
            </button>
        </nav>
    </div>

    <!-- Hidden file upload input for double-click feature -->
    <input type="file" id="local-image-upload" class="hidden" multiple accept="image/*">

    <script>
        /* =========================================================
           CUSTOM IMAGE CONFIGURATION
           Add custom URLs here for any post. If you add multiple URLs
           separated by commas, it automatically creates a carousel!
           ========================================================= */
        
        // Config for the Main Home Feed (indexes 0 to 9)
        const customFeedPosts = {
            0: ["https://picsum.photos/seed/home0/1080/1440"],
            1: [
                "https://picsum.photos/seed/home1a/1080/1440", 
                "https://picsum.photos/seed/home1b/1080/1440", 
                "https://picsum.photos/seed/home1c/1080/1440"
            ]
        };

        // Config for Your Profile Grid/Feed (indexes 0 to 11)
        const customProfilePosts = {
            // Post #7 (8th post) acts as a carousel
            7: [
                "https://picsum.photos/seed/grid7_1/1080/1440",
                "https://picsum.photos/seed/grid7_2/1080/1440",
                "https://picsum.photos/seed/grid7_3/1080/1440"
            ],
            // Post #2 acts as a carousel
            2: [
                "https://raw.githubusercontent.com/Rmoosa2014/IllusNewpost/pattern-application-03.png",
                "https://raw.githubusercontent.com/Rmoosa2014/IllusNewpost/pattern-application-04.png"
            ]
        };


        /* =========================================================
           APP LOGIC & HELPER FUNCTIONS
           ========================================================= */
        
        const getRandomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        
        const formatNumber = (num) => {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        };

        const randomUsers = ['design_daily', 'home_aesthetics', 'archi_lover', 'modern.spaces', 'vintage_vibes'];

        // Desktop Swipe (Drag) Logic for Carousels
        function initDragToScroll(slider) {
            let isDown = false;
            let startX;
            let scrollLeft;

            slider.addEventListener('mousedown', (e) => {
                isDown = true;
                startX = e.pageX - slider.offsetLeft;
                scrollLeft = slider.scrollLeft;
                slider.style.scrollSnapType = 'none'; // Prevent fighting with snap during drag
            });
            slider.addEventListener('mouseleave', () => {
                isDown = false;
                slider.style.scrollSnapType = 'x mandatory';
            });
            slider.addEventListener('mouseup', () => {
                isDown = false;
                slider.style.scrollSnapType = 'x mandatory';
            });
            slider.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - slider.offsetLeft;
                const walk = (x - startX) * 2; // Scroll-fast multiplier
                slider.scrollLeft = scrollLeft - walk;
            });
        }

        // Double Click to Upload Logic
        let currentUploadTarget = null;
        
        function triggerUpload(element) {
            currentUploadTarget = element;
            document.getElementById('local-image-upload').click();
        }

        document.getElementById('local-image-upload').addEventListener('change', function(e) {
            if (!currentUploadTarget) return;
            const files = e.target.files;
            if (files.length === 0) return;

            let newHtml = '';
            
            if (files.length === 1) {
                // Single Image
                const url = URL.createObjectURL(files[0]);
                newHtml = `<img src="${url}" class="w-full h-full object-cover">`;
            } else {
                // Multiple Images -> Create Carousel
                newHtml = `<div class="carousel-container hide-scrollbar">`;
                for (let i = 0; i < files.length; i++) {
                    const url = URL.createObjectURL(files[i]);
                    newHtml += `<div class="carousel-slide">
                                    <img src="${url}" alt="Slide ${i+1}">
                                </div>`;
                }
                newHtml += `</div>`;
            }

            currentUploadTarget.innerHTML = newHtml;

            // Re-initialize drag functionality if it's a carousel
            const newCarousel = currentUploadTarget.querySelector('.carousel-container');
            if (newCarousel) {
                initDragToScroll(newCarousel);
            }
            
            // Reset input so the same files can be selected again if needed
            e.target.value = ''; 
        });

        // Standard Post HTML Generator
        // Checks if urls array has multiple items to build a carousel
        function generatePostHTML(urls, username, userDp, caption, isProfileView = false) {
            const likes = formatNumber(getRandomInt(100, 50000));
            const isCarousel = urls.length > 1;
            
            let mediaHtml = '';
            if (isCarousel) {
                mediaHtml = `<div class="carousel-container hide-scrollbar">`;
                urls.forEach(url => {
                    mediaHtml += `<div class="carousel-slide">
                                    <img src="${url}" alt="Post image">
                                  </div>`;
                });
                mediaHtml += `</div>
                              <div class="absolute top-3 right-3 bg-black/50 text-white text-xs px-2 py-1 rounded-full pointer-events-none">
                                1/${urls.length}
                              </div>`;
            } else {
                mediaHtml = `<img src="${urls[0]}" class="w-full h-full object-cover">`;
            }

            return `
                <article class="border-b border-gray-200 pb-4">
                    <!-- Post Header -->
                    <div class="flex justify-between items-center p-3">
                        <div class="flex items-center space-x-2">
                            <div class="story-ring w-8 h-8">
                                <div class="story-ring-inner w-full h-full">
                                    <img src="${userDp}" class="w-full h-full rounded-full object-cover">
                                </div>
                            </div>
                            <span class="font-semibold text-sm">${username}</span>
                        </div>
                        <i class="fa-solid fa-ellipsis"></i>
                    </div>
                    
                    <!-- Post Media (3:4 Ratio Container) -->
                    <!-- Added ondblclick to trigger local file upload -->
                    <div class="post-media-container aspect-3-4" ondblclick="triggerUpload(this)">
                        ${mediaHtml}
                    </div>

                    <!-- Post Actions -->
                    <div class="p-3">
                        <div class="flex justify-between items-center mb-2">
                            <div class="flex space-x-4 text-2xl">
                                <i class="fa-regular fa-heart"></i>
                                <i class="fa-regular fa-comment"></i>
                                <i class="fa-regular fa-paper-plane"></i>
                            </div>
                            <i class="fa-regular fa-bookmark text-2xl"></i>
                        </div>
                        <div class="font-semibold text-sm mb-1">${likes} likes</div>
                        <div class="text-sm">
                            <span class="font-semibold">${username}</span> ${caption}
                        </div>
                        <div class="text-gray-500 text-sm mt-1">View all comments</div>
                        <div class="text-gray-400 text-xs mt-1 uppercase">2 hours ago</div>
                    </div>
                </article>
            `;
        }

        // Render Initial Home Feed
        function renderHomeFeed() {
            const feedContainer = document.getElementById('feed-container');
            let feedHTML = '';
            
            for (let i = 0; i < 10; i++) {
                const user = randomUsers[i % randomUsers.length];
                const dp = `https://picsum.photos/seed/user${i}/100/100`;
                
                // Get URLs from config, or generate a random one
                let urls = customFeedPosts[i] || [`https://picsum.photos/seed/feed${i}/1080/1440`];
                
                feedHTML += generatePostHTML(urls, user, dp, `Check out this amazing inspiration! ✨ #design #home`);
            }
            feedContainer.innerHTML = feedHTML;

            // Initialize drag on any generated carousels
            feedContainer.querySelectorAll('.carousel-container').forEach(initDragToScroll);
        }

        // Render Profile Grid, Reels, and Tagged Tabs
        function renderProfileContents() {
            const gridContainer = document.getElementById('content-grid');
            const reelsContainer = document.getElementById('content-reels');
            const taggedContainer = document.getElementById('content-tagged');
            
            let gridHtml = '';
            let reelsHtml = '';
            let taggedHtml = '';

            // Generate Grid Items (12 items)
            for (let i = 0; i < 12; i++) {
                let urls = customProfilePosts[i] || [`https://picsum.photos/seed/grid${i}/1080/1440`];
                let isCarousel = urls.length > 1;
                let firstImage = urls[0]; 

                gridHtml += `
                    <div class="grid-item aspect-3-4" onclick="openProfilePost(${i})">
                        <img src="${firstImage}" alt="Post">
                        ${isCarousel ? '<i class="fa-solid fa-clone absolute top-2 right-2 text-white carousel-icon text-sm"></i>' : ''}
                    </div>
                `;
            }

            // Generate Reels Items (12 items, 9:16 aspect ratio)
            for (let i = 0; i < 12; i++) {
                reelsHtml += `
                    <div class="bg-gray-200 overflow-hidden relative cursor-pointer" style="aspect-ratio: 9/16;">
                        <img src="https://picsum.photos/seed/reel${i}/720/1280" class="w-full h-full object-cover">
                        <div class="absolute bottom-2 left-2 flex items-center text-white text-xs font-bold filter drop-shadow-md">
                            <i class="fa-solid fa-play mr-1"></i> ${formatNumber(getRandomInt(5000, 1000000))}
                        </div>
                    </div>
                `;
            }
            
            // Generate Tagged Items (6 items)
            for (let i = 0; i < 6; i++) {
                taggedHtml += `
                    <div class="grid-item aspect-3-4">
                        <img src="https://picsum.photos/seed/tagged${i}/1080/1440" alt="Tagged Post">
                        <i class="fa-solid fa-user-tag absolute bottom-2 left-2 text-white drop-shadow-md text-sm"></i>
                    </div>
                `;
            }

            gridContainer.innerHTML = gridHtml;
            reelsContainer.innerHTML = reelsHtml;
            taggedContainer.innerHTML = taggedHtml;
        }

        // Open specific grid item in the expanded feed view
        function openProfilePost(startIndex) {
            document.getElementById('view-profile').classList.add('hidden');
            document.getElementById('view-profile-feed').classList.remove('hidden');
            
            const container = document.getElementById('profile-feed-container');
            let feedHTML = '';

            // Generate the feed for all 12 profile posts
            for (let i = 0; i < 12; i++) {
                let urls = customProfilePosts[i] || [`https://picsum.photos/seed/grid${i}/1080/1440`];
                
                feedHTML += `
                    <div id="profile-post-${i}">
                        ${generatePostHTML(urls, 'lighting.stores', 'https://picsum.photos/seed/lightingdp/100/100', `Our latest elegant lighting setup. Illuminating your space. 💡✨ #lighting #design`, true)}
                    </div>
                `;
            }
            
            container.innerHTML = feedHTML;
            container.querySelectorAll('.carousel-container').forEach(initDragToScroll);

            // Scroll down to the specific post that was clicked
            setTimeout(() => {
                const targetPost = document.getElementById(`profile-post-${startIndex}`);
                if (targetPost) {
                    targetPost.scrollIntoView({ behavior: 'auto' });
                }
            }, 50);
        }

        function closeProfilePost() {
            document.getElementById('view-profile-feed').classList.add('hidden');
            document.getElementById('view-profile').classList.remove('hidden');
            // Scroll back to top of profile view to prevent visual bugs
            document.getElementById('app-views').scrollTop = 0;
        }


        function switchView(view) {
            document.getElementById('view-feed').classList.add('hidden');
            document.getElementById('view-profile').classList.add('hidden');
            document.getElementById('view-profile-feed').classList.add('hidden');
            
            document.getElementById('nav-home').classList.remove('text-black');
            document.getElementById('nav-home').classList.add('text-gray-400');
            document.getElementById('nav-profile').classList.remove('border-black');
            document.getElementById('nav-profile').classList.add('border-transparent');

            if (view === 'feed') {
                document.getElementById('view-feed').classList.remove('hidden');
                document.getElementById('nav-home').classList.add('text-black');
                document.getElementById('nav-home').classList.remove('text-gray-400');
            } else if (view === 'profile') {
                document.getElementById('view-profile').classList.remove('hidden');
                document.getElementById('nav-profile').classList.add('border-black');
                document.getElementById('nav-profile').classList.remove('border-transparent');
            }
            
            document.getElementById('app-views').scrollTop = 0;
        }

        function switchProfileTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');

            document.getElementById('content-grid').classList.add('hidden');
            document.getElementById('content-reels').classList.add('hidden');
            document.getElementById('content-tagged').classList.add('hidden');

            document.getElementById(`content-${tab}`).classList.remove('hidden');
        }

        function renderStories() {
            const container = document.getElementById('stories-container');
            let html = '';
            for(let i=0; i<6; i++) {
                html += `
                    <div class="flex flex-col items-center min-w-[70px]">
                        <div class="story-ring w-16 h-16">
                            <div class="story-ring-inner w-full h-full">
                                <img src="https://picsum.photos/seed/story${i}/100/100" class="w-full h-full rounded-full object-cover">
                            </div>
                        </div>
                        <span class="text-xs mt-1 text-gray-800 truncate w-16 text-center">${randomUsers[i % randomUsers.length]}</span>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        // Initialize App
        window.onload = () => {
            renderStories();
            renderHomeFeed();
            renderProfileContents();
            
            // AUTOMATICALLY DEFAULT TO THE PROFILE VIEW ON LOAD
            switchView('profile'); 
        };
    </script>
</body>
</html>
